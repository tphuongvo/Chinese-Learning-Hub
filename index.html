<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chinese-learning-hub-PhuongVo</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2a2420;--mu:#7d7268;--ac:#c0392b;--ac2:#f6e3df;--bd:#e7dfd5;--ok:#2e8b57;--no:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#292524;--tx:#f1ebe4;--mu:#a69b90;--ac:#e8695a;--ac2:#40272a;--bd:#3d3733;--ok:#4cc38a;--no:#ef6f61}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#292524;--tx:#f1ebe4;--mu:#a69b90;--ac:#e8695a;--ac2:#40272a;--bd:#3d3733;--ok:#4cc38a;--no:#ef6f61}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
nav button{flex:1;white-space:nowrap}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:10px}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:12px}
.hz{font-size:64px;line-height:1.2;text-align:center;font-family:"Noto Serif SC","Songti SC",SimSun,serif}
.py{text-align:center;font-size:22px;color:var(--ac)}
.mn{text-align:center;font-size:20px;margin-top:6px}
.ex{text-align:center;margin-top:12px;font-size:15px;padding-top:10px;border-top:1px dashed var(--bd)}
.ex .exh{font-size:20px;font-family:"Noto Serif SC","Songti SC",SimSun,serif}
.ex .exp{color:var(--ac);font-size:15px}
.ex .exm{color:var(--mu)}
.mu{color:var(--mu);font-size:14px;text-align:center}
.lbl{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;transition:opacity .2s}
.grades.off{opacity:0;pointer-events:none}
.grades button small{display:block;color:inherit;opacity:.7;font-size:11px}
textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);resize:vertical}
input,select{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
input.good,input.good:disabled{background:rgba(46,139,87,.18);border-color:var(--ok);color:var(--ok);font-weight:600;opacity:1}
input.bad,input.bad:disabled{background:rgba(192,57,43,.12);border-color:var(--no);opacity:1}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
.fb{margin-top:12px;padding:10px;border-radius:10px;text-align:center}
.fb.ok{background:rgba(46,139,87,.15);color:var(--ok)}.fb.no{background:rgba(192,57,43,.15);color:var(--no)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{text-align:center;margin:0}.stat b{font-size:26px;display:block;color:var(--ac)}
.stat span{font-size:13px;color:var(--mu)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:8px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--bd)}
.l1{background:#e9b4ac!important}.l2{background:#d9695a!important}.l3{background:#a82a1c!important}
.tbars{display:flex;gap:8px;align-items:flex-end;height:110px;margin-top:10px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mu)}
.tcol i{display:block;width:100%;background:var(--ac);border-radius:6px 6px 0 0;min-height:2px}
.tcol.z i{background:var(--bd)}
.list{overflow-x:auto}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);align-items:center}
.item:last-child{border:0}.item .h{font-size:22px}
.tag{font-size:12px;background:var(--ac2);color:var(--ac);padding:1px 8px;border-radius:99px}
.hide{display:none}
/* flip card */
.flip{perspective:1200px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.flip-in{display:grid;transition:transform .5s;transform-style:preserve-3d}
.flip-in.on{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;min-height:240px;display:flex;flex-direction:column;justify-content:center}
.face.back{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}}
.rads{margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px;font-size:14px}
.rrow{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:4px 0}
.rch{font-size:18px;font-family:"Noto Serif SC","Songti SC",SimSun,serif}
.rc{font-size:22px;color:var(--ac);font-family:"Noto Serif SC","Songti SC",SimSun,serif}
/* dictation */
.seq{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.bar{height:6px;background:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.tk{display:inline-block;min-width:.9em;margin:0 4px;text-align:center}
.tk.b{color:var(--no)}
table.keys{width:100%;border-collapse:collapse;font-size:14px;margin-top:14px}
table.keys td{padding:6px 4px;border-top:1px solid var(--bd)}
table.keys td:first-child{white-space:nowrap;width:1%}
kbd{font:inherit;font-size:13px;border:1px solid var(--bd);border-bottom-width:2px;border-radius:6px;padding:1px 8px;background:var(--bg)}
/* radicals */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px}
.rt{display:flex;flex-direction:column;align-items:center;padding:6px 2px;line-height:1.2}
.rt b{font-size:26px;font-weight:400;font-family:"Noto Serif SC","Songti SC",SimSun,serif}
.rt small{font-size:10px;color:var(--mu);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt.sel{border-color:var(--ac);background:var(--ac2)}
table.dt{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.dt th{position:sticky;top:0;background:var(--card);text-align:left;color:var(--mu);font-weight:500;padding:6px 4px}
table.dt td{padding:6px 4px;border-top:1px solid var(--bd)}
table.dt td:nth-child(n+2),table.dt th:nth-child(n+2){text-align:right}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-top:14px;font-size:15px}
.dl dt{color:var(--mu)}.dl dd{margin:0}
</style>
</head>

var D={deck:[],pos:0,round:1,mode:"word",rate:0.8,score:{ok:0,n:0},typed:"",st:"typing",tries:0,mask:"",res:null};
function norm(s){return s.replace(/[üǖǘǚǜ]/g,"v").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ü/g,"v").replace(/[^a-zA-Z]/g,"").toLowerCase()}
function strip(s){return s.replace(/[\s，。！？、,.!?]/g,"")}

function dicPool(){return S.cards.filter(function(c){return D.mode==="sent"?!!c.ex:true}).map(function(c){return c.id})}
function dicReset(){D.typed="";D.st="typing";D.tries=0;D.mask="";D.res=null}
function dicEnsure(){
 var pool=dicPool();
 D.deck=D.deck.filter(function(id){return pool.indexOf(id)>-1});
 if(!D.deck.length){D.deck=shuffle(pool.slice());D.pos=0}

}

function maskText(target,typed,pin){
 var T=[];typed.split("").forEach(function(ch){var k=pin?norm(ch):(isP(ch)?"":ch);if(k)T.push(k)});
 var i=0,ok=true,html="";
 target.split("").forEach(function(ch){
  var k=pin?norm(ch):(isP(ch)?"":ch);
  if(!k){html+=`<span class="tk">${ch===" "?"&nbsp;":esc(ch)}</span>`;return}
  if(T[i]===k)html+=`<span class="tk">${esc(ch)}</span>`;else{html+='<span class="tk b">_</span>';ok=false}
  i++;
 });
 return{html:html,ok:ok&&T.length===i};
}
function dicClear(){D.typed="";D.st="typing";var inp=$("ans");if(inp&&!D.res){inp.value="";inp.classList.remove("bad");inp.focus()}}

 if(D.res){if(!D.res.gave)dicNext();return}
 if(!$("ans"))return;
 if(D.st==="wrong"){dicClear();renderDic();return}
 dicCheck();
}
function dicCheck(){
 var inp=$("ans"),c=dicCard(),a=inp.value.trim();
 if(!a)return;
 var pin=D.mode==="word"&&!isCJK(a);
 var r=maskText(pin?c.p:dicTarget(),a,pin);
 D.typed=a;
 if(r.ok){D.res={gave:false};D.score.n++;if(D.tries===0)D.score.ok++;logAct();save();renderDic();return}
 if(D.tries===0){c.wrong=(c.wrong||0)+1;save()}
 D.tries++;D.st="wrong";D.mask=r.html;renderDic();
}
function dicReveal(){
 if(D.res)return;
 var c=dicCard();if(D.tries===0)c.wrong=(c.wrong||0)+1;D.tries++;
 var inp=$("ans");if(inp)D.typed=inp.value;
 D.res={gave:true};D.score.n++;logAct();save();renderDic();
}
function dicNext(){
 if(!D.deck.length)return;
 if(!D.res&&D.tries>0){D.score.n++;logAct();save()}
 D.pos++;
 if(D.pos>=D.deck.length){D.deck=shuffle(dicPool());D.pos=0;D.round++}

 if(!S.cards.length||!dicPool().length){el.innerHTML='<div class="card mu">Chưa có dữ liệu để luyện. Hãy thêm từ vựng (chế độ chép câu cần có câu ví dụ).</div>';
  if(!S.cards.length)return;
  D.mode="word";}
 dicEnsure();
 var c=dicCard(),target=dicTarget(),total=D.deck.length,label=D.mode==="word"?"Từ":"Câu",res="";
 if(D.res){
  res=`<div class="fb ${D.res.gave?"no":"ok"}">${D.res.gave?"Đáp án":(D.tries===0?"✓ Chính xác!":"✓ Đúng rồi sau "+(D.tries+1)+" lần thử")}<div class="hz" style="font-size:32px">${esc(target)}</div>${D.mode==="word"?`<div class="py" style="font-size:18px">${esc(c.p)} · ${esc(c.m)}</div>`:`<div class="py" style="font-size:18px">${esc(c.exp||"")}</div><div class="mu">${esc(c.exm||c.m)}</div>`}<div class="mu">${D.res.gave?"Nhấn <kbd>→</kbd>":"Nhấn <kbd>Enter</kbd> hoặc <kbd>→</kbd>"} để sang ${label.toLowerCase()} tiếp theo</div></div>`;
 }else if(D.mask){
  res=`<div class="fb no">${D.st==="wrong"?"Chưa đúng. Nhấn Enter để xoá rồi gõ lại.":"Gợi ý từ lần gõ trước"}<div class="hz" style="font-size:36px">${D.mask}</div></div>`;
 }
 var cls=D.res?(D.res.gave?"bad":"good"):(D.st==="wrong"?"bad":"");
 el.innerHTML=`<div class="card">

var q="",gq="",PQ=false,PYC={};
/* ----- Đối chiếu pinyin với pinyin chuẩn (pinyin-pro) ----- */
function pyLib(){return typeof pinyinPro!=="undefined"&&pinyinPro&&pinyinPro.pinyin?pinyinPro:null}
function stdArr(h){
 var L=pyLib();if(!L)return null;
 if(PYC[h]!==undefined)return PYC[h];
 var r=null;
 try{r=L.pinyin(h,{toneType:"symbol",type:"array",toneSandhi:false})}catch(e){r=null}
 return PYC[h]=r;
}
function pyKey(s){return String(s).normalize("NFC").toLowerCase().replace(/[\s'’\-·.,，。!?！？]/g,"").replace(/v/g,"ü")}
function pyStatus(c){
 var h=c.h||"";
 if(!isCJK(h))return{st:"na"};
 var arr=stdArr(h);if(!arr)return{st:"nolib"};
 var pure=h.replace(/[一-鿿]/g,"")==="";
 var syl=pure?arr.slice():arr.filter(function(x){return /[a-züāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/i.test(x)&&!isCJK(x)});
 var std=syl.join(" ");
 var u=(c.p||"").trim();
 if(!u)return{st:"empty",std:std};
 var vars=[syl.join("")];
 if(pure&&syl.length===h.length){
  vars=[""];
  syl.forEach(function(sy,i){
   var ch=h.charAt(i),alts=[sy];
   if(ch==="不")alts=["bù","bú","bu"];else if(ch==="一")alts=["yī","yí","yì","yi"];
   vars=vars.reduce(function(a,p){return a.concat(alts.map(function(x){return p+x}))},[]);
  });
 }
 var uk=pyKey(u);
 if(vars.some(function(v){return pyKey(v)===uk}))return{st:"ok",std:std};
 var ub=norm(u);
 if(vars.some(function(v){return norm(v)===ub}))return{st:"tone",std:std};
 return{st:"diff",std:std};
}
function needsPy(c){var s=pyStatus(c).st;return s==="tone"||s==="diff"||s==="empty"}
function pyScan(list){var o={ok:0,tone:0,diff:0,empty:0,na:0,nolib:0};list.forEach(function(c){o[pyStatus(c).st]++});return o}
function pyBadge(c){
 var r=pyStatus(c);
 if(r.st==="ok"||r.st==="na"||r.st==="nolib")return"";
 var msg=r.st==="empty"?"Chưa có pinyin":r.st==="tone"?"Lệch thanh điệu":"Khác pinyin chuẩn";
 return `<div style="font-size:13px;color:var(--no);text-align:left">⚠ ${msg}. Chuẩn: <b>${esc(r.std)}</b> <button data-pf="${c.id}" style="padding:2px 8px;font-size:12px">Dùng</button></div>`;
}
function renderPyc(onFilter){

 <div style="font-size:14px">✓ Khớp: <b>${o.ok}</b> · ⚠ Lệch thanh điệu: <b>${o.tone}</b> · ✗ Khác pinyin chuẩn: <b>${o.diff}</b> · ∅ Thiếu pinyin: <b>${o.empty}</b></div>
 <label class="mu" style="display:block;text-align:left;margin-top:8px"><input type="checkbox" id="pq" style="width:auto"${PQ?" checked":""}> Chỉ hiện từ cần xem lại (${bad})</label>
 ${bad?`<button id="pyall" style="width:100%;margin-top:8px">Sửa tất cả theo pinyin chuẩn (${bad} từ)</button>`:""}`;
 $("pq").onchange=function(){PQ=this.checked;onFilter()};
 if($("pyall"))$("pyall").onclick=function(){
  uiConfirm("Thay pinyin của "+bad+" từ bằng pinyin chuẩn?",function(){
   S.cards.forEach(function(c){if(needsPy(c))c.p=pyStatus(c).std});
   save();renderVoc();
  });
 };

 o.querySelector("#bkdl").onclick=async function(){

  d.audio=audio;

  if(dl){
   try{await dl.save({filename:fn,data:blob});msg("Đã lưu "+info+".")}
   catch(e){msg(e&&e.code==="declined"?"Bạn đã huỷ việc lưu file.":"Không lưu được file ("+((e&&e.code)||(e&&e.message)||"lỗi")+"). Hãy dùng nút Sao chép JSON.")}
  }else{
   var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;
   document.body.appendChild(a);a.click();document.body.removeChild(a);
   msg("Đã tạo file "+info+". Nếu trình duyệt không tải xuống, hãy dùng nút Sao chép JSON.");
  }
 };

 <div class="card"><b>Thêm từ mới</b><div class="row"><input id="ng" placeholder="Phân nhóm"><input id="nt" placeholder="Phân dạng từ"></div><div class="row"><input id="nh" placeholder="Từ mới (chữ Hán)"><input id="np" placeholder="Pinyin"></div><div class="mu" id="nhint" style="text-align:left;margin-top:4px"></div><div class="row"><input id="nm" placeholder="Giải thích"></div><div class="row"><input id="ne" placeholder="Ví dụ (chữ Hán)"></div><div class="row"><input id="nep" placeholder="Phiên âm ví dụ"><input id="nem" placeholder="Dịch"></div><button class="pri" id="add" style="width:100%;margin-top:10px">Thêm</button></div>

/* Biểu đồ: cột = thời gian active mỗi ngày (phút), đường = tổng cộng dồn đến hiện tại (giờ) */
function timeChart(t){
 var keys=Object.keys(S.time).map(Number).filter(function(k){return S.time[k]>0});
 if(!keys.length)return '<p class="mu">Chưa có dữ liệu để vẽ biểu đồ.</p>';
 var first=Math.min.apply(null,keys),start=Math.max(first,t-89),n=t-start+1;
 var base=0;keys.forEach(function(k){if(k<start)base+=S.time[k]});
 var mins=[],cum=[],run=base;
 for(var i=0;i<n;i++){var s=S.time[start+i]||0;run+=s;mins.push(s/60);cum.push(run/3600)}
 var W=Math.max(300,($("sta").clientWidth||380)-40),H=230,pl=38,pr=40,pt=18,pb=28,pw=W-pl-pr,ph=H-pt-pb;
 function nice(v){var e=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)),f=v/e;return(f<=1?1:f<=2?2:f<=5?5:10)*e}
 var mx=nice(Math.max(Math.max.apply(null,mins),5)),cx=nice(Math.max(cum[n-1],0.1));
 var step=pw/n,bw=Math.max(1,Math.min(28,step*0.72));
 function X(i){return pl+step*(i+0.5)}
 function YM(v){return pt+ph-v/mx*ph}
 function YC(v){return pt+ph-v/cx*ph}
 function dm(d){var x=new Date(d*864e5);return("0"+x.getUTCDate()).slice(-2)+"/"+("0"+(x.getUTCMonth()+1)).slice(-2)}
 function dmy(d){return dm(d)+"/"+new Date(d*864e5).getUTCFullYear()}
 function fh(v){return String(+v.toFixed(1))}
 var g="";
 [0,0.5,1].forEach(function(f){
  var y=pt+ph-f*ph;
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" style="stroke:var(--bd)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" style="fill:var(--mu);font-size:11px">${Math.round(f*mx)}</text><text x="${W-pr+6}" y="${y+4}" style="fill:var(--mu);font-size:11px">${fh(f*cx)}</text>`;
 });
 g+=`<text x="${pl-6}" y="10" text-anchor="end" style="fill:var(--ac);font-size:11px">phút</text><text x="${W-pr+6}" y="10" style="fill:var(--ok);font-size:11px">giờ</text>`;
 var bars="";
 mins.forEach(function(m,i){if(m>0)bars+=`<rect x="${X(i)-bw/2}" y="${YM(m)}" width="${bw}" height="${pt+ph-YM(m)}" rx="2" style="fill:var(--ac);opacity:.85"><title>${dmy(start+i)}: ${fmtDur(m*60)}</title></rect>`});
 var pts=cum.map(function(c,i){return X(i).toFixed(1)+","+YC(c).toFixed(1)}).join(" ");
 var last=n-1,mid=Math.floor(n/2),lbl=`<text x="${pl}" y="${H-8}" text-anchor="start" style="fill:var(--mu);font-size:11px">${dm(start)}</text>`;
 if(n>2)lbl+=`<text x="${X(mid)}" y="${H-8}" text-anchor="middle" style="fill:var(--mu);font-size:11px">${dm(start+mid)}</text>`;
 if(n>1)lbl+=`<text x="${W-pr}" y="${H-8}" text-anchor="end" style="fill:var(--mu);font-size:11px">${dm(t)}</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ thời gian hoạt động mỗi ngày và cộng dồn" style="display:block;margin-top:8px">${g}${bars}<polyline points="${pts}" fill="none" style="stroke:var(--ok)" stroke-width="2" stroke-linejoin="round"/><circle cx="${X(last)}" cy="${YC(cum[last])}" r="4" style="fill:var(--ok)"><title>Tổng đến ${dmy(t)}: ${fmtDur(cum[last]*3600)}</title></circle>${lbl}</svg>
 <div class="mu" style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap"><span><i style="display:inline-block;width:10px;height:10px;background:var(--ac);border-radius:2px;margin-right:4px"></i>Mỗi ngày (phút, trục trái)</span><span><i style="display:inline-block;width:14px;height:3px;background:var(--ok);margin-right:4px;vertical-align:middle"></i>Cộng dồn đến hiện tại (giờ, trục phải)</span></div>${first<start?'<div class="mu">Hiển thị 90 ngày gần nhất; cộng dồn tính từ ngày đầu tiên.</div>':""}`;
}

 ${dayCard}

}

/* =====================================================
   NGHE CHÉP TỪ FILE ÂM THANH / YOUTUBE
   Bài = nguồn âm thanh + lời thoại (đáp án) có mốc thời gian từng câu.
   ===================================================== */
var LES={cur:null,view:"home",pos:0,typed:"",st:"typing",tries:0,mask:"",res:null,rate:1,url:null,fname:"",segEnd:null,
 ytTime:0,ytDur:0,ytSeen:false,ytWarn:false,hs:null,marks:[],markPos:0,score:{ok:0,n:0}};
function curLesson(){return S.lessons.find(function(l){return l.id===LES.cur})}
function ytId(u){
 u=String(u).trim();
 var m=u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/);
 return m?m[1]:(/^[\w-]{11}$/.test(u)?u:null);
}
function fmtT(s){s=Math.max(0,Math.round(s*100)/100);var m=Math.floor(s/60),x=Math.round((s-m*60)*100)/100,xs=x.toFixed(2);return("0"+m).slice(-2)+":"+(x<10?"0":"")+xs}
function tsec(s){s=String(s).replace(",",".");var p=s.split(":").map(parseFloat);return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]}
/* Đọc giờ người dùng gõ: 3.85 · 3,85 · 3s85 · 3.85s · 0:03.85 · 1m05s · 1:05 */
function parseTime(str){
 var x=String(str).toLowerCase().trim().replace(/\s+/g,"");
 if(!x)return null;
 x=x.replace(/(\d)(?:phút|ph|m)(\d)/,"$1:$2").replace(/(\d)(?:phút|ph|m)$/,"$1:00");
 x=x.replace(/(\d)(?:giây|gi|s)(\d)/,"$1.$2").replace(/(?:giây|gi|s)$/,"").replace(",",".");
 if(!/^\d+(?::\d+){0,2}(?:\.\d+)?$/.test(x))return NaN;
 var p=x.split(":").map(parseFloat);
 if(p.length>1&&p.slice(1).some(function(v){return v>=60}))return NaN;
 return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0];
}
function splitSent(t){return t.match(/[^。！？!?；;…]+[。！？!?；;…]*/g)||[t]}
/* Đọc lời thoại: SRT/VTT, LRC, bản chép lời dán từ YouTube (giờ riêng một dòng), "mm:ss lời", hoặc mỗi câu một dòng */
function parseTranscript(txt){
 txt=String(txt).replace(/\r/g,"").replace(/^﻿/,"");
 var items=[];
 if(/-->/.test(txt)){
  txt.split(/\n{2,}/).forEach(function(blk){
   var ls=blk.split("\n").filter(function(x){return x.trim()});
   var i=ls.findIndex(function(l){return /-->/.test(l)});if(i<0)return;
   var m=ls[i].match(/([\d:.,]+)\s*-->\s*([\d:.,]+)/);if(!m)return;
   var t=ls.slice(i+1).join("").replace(/<[^>]+>/g,"").trim();
   if(t)items.push({t:tsec(m[1]),e:tsec(m[2]),txt:t});
  });
  return items;
 }
 var cur=null,reBr=/^\[(\d{1,2}:\d{2}(?:\.\d+)?)\]\s*(.*)$/,reOnly=/^(?:\d{1,2}:)?\d{1,2}:\d{2}$/,reIn=/^((?:\d{1,2}:)?\d{1,2}:\d{2})\s+(\S.*)$/;
 txt.split("\n").map(function(l){return l.trim()}).filter(Boolean).forEach(function(l){
  var m;
  if(/^\[[a-z]+:.*\]$/i.test(l))return;
  if((m=l.match(reBr))){cur={t:tsec(m[1]),e:null,txt:m[2],open:false};items.push(cur);return}
  if(reOnly.test(l)){cur={t:tsec(l),e:null,txt:"",open:true};items.push(cur);return}
  if((m=l.match(reIn))){cur={t:tsec(m[1]),e:null,txt:m[2],open:false};items.push(cur);return}
  if(cur&&cur.open){cur.txt+=l;return}
  cur=null;
  splitSent(l).forEach(function(s){s=s.trim();if(s)items.push({t:null,e:null,txt:s})});
 });
 items=items.filter(function(i){return i.txt&&i.txt.trim()}).map(function(i){return{t:i.t,e:i.e,txt:i.txt.trim()}});
 items.forEach(function(it,i){var nx=items[i+1];if(it.t!=null&&nx&&nx.t!=null&&nx.t>it.t)it.e=nx.t});
 return items;
}
/* ----- Trình phát (file âm thanh hoặc YouTube) ----- */
function ytWin(){var f=$("yt");return f&&f.contentWindow}
function ytCmd(fn,args){var w=ytWin();if(w)w.postMessage(JSON.stringify({event:"command",func:fn,args:args||[]}),"*")}
window.addEventListener("message",function(e){
 if(!/youtube(-nocookie)?\.com$/.test(String(e.origin||"").replace(/^https?:\/\//,"")))return;
 var d;try{d=typeof e.data==="string"?JSON.parse(e.data):e.data}catch(x){return}
 if(!d)return;
 if(d.info){LES.ytSeen=true;if(d.info.currentTime!==undefined)LES.ytTime=d.info.currentTime;if(d.info.duration)LES.ytDur=d.info.duration}
 else if(d.event==="onReady")LES.ytSeen=true;
});

 LES.ytSeen=false;LES.ytWarn=false;var n=0;clearInterval(LES.hs);
 LES.hs=setInterval(function(){
  var w=ytWin();n++;
  if(w)w.postMessage(JSON.stringify({event:"listening",id:1,channel:"widget"}),"*");
  if(LES.ytSeen||n>20){clearInterval(LES.hs);if(!LES.ytSeen){LES.ytWarn=true;if($("lmsg"))$("lmsg").style.display="block"}}

/* Phát file âm thanh bằng Web Audio: giải mã cả file rồi phát chính xác từ giây bất kỳ (không phụ thuộc cách trình duyệt tua file mp3) */
var P={ctx:null,buf:null,id:null,src:null,playing:false,off:0,t0:0,rate:1,endAt:null};
function pLoad(blob,id){
 if(P.id===id&&P.buf)return Promise.resolve();
 pStop();P.id=id;P.buf=null;P.off=0;
 var AC=window.AudioContext||window.webkitAudioContext;if(!P.ctx)P.ctx=new AC();
 return blob.arrayBuffer().then(function(ab){return new Promise(function(res,rej){var r=P.ctx.decodeAudioData(ab,res,rej);if(r&&r.then)r.then(res,rej)})}).then(function(b){P.buf=b});
}
function pStop(){var s0=P.src;P.src=null;P.playing=false;if(s0){try{s0.onended=null;s0.stop()}catch(e){}}}
function pPos(){
 if(!P.buf)return 0;
 var d=P.buf.duration;
 return P.playing?Math.min(d,P.off+(P.ctx.currentTime-P.t0)*P.rate):Math.min(P.off,d);
}
function pPlayFile(t,e){
 if(!P.buf)return;
 try{P.ctx.resume()}catch(x){}
 pStop();
 t=Math.max(0,Math.min(t,P.buf.duration-0.01));
 var s0=P.ctx.createBufferSource();s0.buffer=P.buf;s0.playbackRate.value=LES.rate;s0.connect(P.ctx.destination);
 P.rate=LES.rate;P.off=t;P.t0=P.ctx.currentTime;P.endAt=e==null?null:e;P.src=s0;P.playing=true;
 s0.onended=function(){if(P.src!==s0)return;P.src=null;P.playing=false;P.off=e!=null?e:P.buf.duration};
 s0.start(0,t);
 if(e!=null&&e>t)s0.stop(P.ctx.currentTime+(e-t)/LES.rate);
}
function pTime(){var l=curLesson();if(!l)return 0;return l.src.type==="file"?pPos():LES.ytTime}
function pPlayAt(t,e){
 var l=curLesson();if(!l)return;
 LES.segEnd=e==null?null:e;
 if(l.src.type==="file")pPlayFile(t,e);
 else{ytCmd("seekTo",[t,true]);ytCmd("setPlaybackRate",[LES.rate]);ytCmd("playVideo")}
}
function pPause(){var l=curLesson();if(!l)return;if(l.src.type==="file"){if(P.playing){P.off=pPos();pStop()}}else ytCmd("pauseVideo")}
function pToggle(){var l=curLesson();if(!l)return;if(l.src.type==="file"){if(P.playing)pPause();else{LES.segEnd=null;pPlayFile(P.off>=(P.buf?P.buf.duration:0)-0.05?0:P.off,null)}}else{ytCmd("playVideo")}}
function pSeek(t){if(P.playing)pPlayFile(t,null);else P.off=t}

/* Tự cắt đoạn theo khoảng lặng (chỉ file âm thanh): trả về các câu chưa có lời thoại */
async function detectSegs(file){
 var AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();
 var ab=await ctx.decodeAudioData(await file.arrayBuffer());try{ctx.close()}catch(e){}
 var ch=ab.numberOfChannels,sr=ab.sampleRate,w=Math.floor(sr*0.02),n=Math.floor(ab.length/w),r=new Float32Array(n);
 var data=[];for(var c=0;c<ch;c++)data.push(ab.getChannelData(c));
 for(var i=0;i<n;i++){var s=0;for(var c2=0;c2<ch;c2++){var d=data[c2];for(var k=i*w;k<(i+1)*w;k++)s+=d[k]*d[k]}r[i]=Math.sqrt(s/(w*ch))}
 var sorted=Array.prototype.slice.call(r).sort(function(a,b){return a-b}),peak=sorted[Math.floor(n*0.95)]||0;
 var thr=Math.max(0.004,peak*0.12),gap=Math.round(0.35/0.02),segs=[],st=-1,last=-1;
 for(var j=0;j<n;j++){
  if(r[j]>thr){if(st<0)st=j;last=j}
  else if(st>=0&&j-last>gap){segs.push([st,last]);st=-1}
 }
 if(st>=0)segs.push([st,last]);
 var dur=ab.duration;
 return segs.filter(function(s){return (s[1]-s[0])*0.02>=0.25}).map(function(s,idx,arr){
  var t=Math.max(0,s[0]*0.02-0.12),e=Math.min(dur,(s[1]+1)*0.02+0.15);
  return{t:t,e:e,txt:""};
 });
}

function audDb(){return new Promise(function(res,rej){try{var r=indexedDB.open("zh-audio",1);r.onupgradeneeded=function(){r.result.createObjectStore("f")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}

function audGet(id){return audOp("readonly",function(st){return st.get(id)}).then(function(b){return b&&b.size?b:null})}

 return it.e!=null?it.e:(nx&&nx.t!=null&&nx.t>it.t?nx.t:it.t+10);
}
function lisPlay(){
 var l=curLesson();if(!l||LES.view!=="practice")return;
 var it=lisIt();if(!it)return;
 pPlayAt(it.t,segEndOf(it));
}
function lisRetry(){lisPlay();if(LES.res)return;LES.typed="";LES.st="typing";renderLBody()}
function lisCheck(){
 var inp=$("lans"),it=lisIt(),a=inp?inp.value.trim():"";if(!a||!it)return;
 if(!it.txt){it.mine=a;LES.typed=a;LES.res={gave:false,free:true};save();logAct();renderLBody();return}
 var pin=!isCJK(a),tp=pin?lisPin(it.txt):it.txt;
 if(pin&&!tp){alert("Chưa tải được thư viện pinyin nên chưa chấm được pinyin. Hãy gõ chữ Hán.");return}
 var r=maskText(tp,a,pin);LES.typed=a;
 if(r.ok){LES.res={gave:false};LES.score.n++;if(LES.tries===0)LES.score.ok++;logAct();save();renderLBody();return}
 if(LES.tries===0){it.wrong=(it.wrong||0)+1;save()}
 LES.tries++;LES.st="wrong";LES.mask=r.html;renderLBody();
}
function lisEnter(){
 if(LES.res){if(!LES.res.gave)lisNext();return}
 if(!$("lans"))return;
 if(LES.st==="wrong"){LES.typed="";LES.st="typing";renderLBody();return}
 lisCheck();
}
function lisReveal(){
 if(LES.res||!$("lans")||!lisIt().txt)return;
 var inp=$("lans"),it=lisIt();LES.typed=inp.value;
 if(LES.tries===0&&it)it.wrong=(it.wrong||0)+1;LES.tries=Math.max(1,LES.tries);
 LES.res={gave:true};LES.score.n++;logAct();save();renderLBody();
}
function lisNext(){
 var l=curLesson();if(!l||LES.pos>=LES.deck.length)return;
 if(!LES.res&&LES.tries>0){LES.score.n++;logAct()}
 LES.pos++;if(LES.order==="seq")l.pos=LES.pos;lisReset();save();lisPause();renderLBody();
 if(LES.pos<LES.deck.length)setTimeout(lisPlay,150);
}
function lisPrev(){
 var l=curLesson();if(!l||LES.pos<=0)return;
 LES.pos--;if(LES.order==="seq")l.pos=LES.pos;lisReset();save();renderLBody();setTimeout(lisPlay,150);
}
function lisRestart(){LES.pos=0;LES.round++;var l=curLesson();if(LES.order==="seq")l.pos=0;lisDeck();lisReset();save();renderLBody();setTimeout(lisPlay,200)}
function renderLBody(){
 var l=curLesson(),n=LES.deck.length,el=$("lbody");
 if(!el)return;
 if(LES.pos>=n){
  var hard=l.items.filter(function(i){return i.wrong>0}).sort(function(a,b){return b.wrong-a.wrong}).slice(0,8);
  el.innerHTML=`<div class="card"><div style="text-align:center"><div class="hz">🎉</div><div class="mn">Hoàn thành vòng ${LES.round}!</div><p class="mu">Đúng ngay lần đầu: ${LES.score.ok}/${LES.score.n} câu</p></div>
  ${hard.length?`<b>Câu hay sai</b><div class="list">${hard.map(function(i){return `<div class="item"><span style="text-align:left">${esc(i.txt)}</span><span class="mu">${i.wrong} lần</span></div>`}).join("")}</div>`:""}
  <div class="row" style="justify-content:center"><button class="pri" id="lredo">Làm vòng mới</button>${hard.length?'<button id="lhard">Chỉ luyện câu sai</button>':""}</div></div>`;
  $("lredo").onclick=function(){LES.score={ok:0,n:0};lisRestart()};
  if($("lhard"))$("lhard").onclick=function(){LES.order="wrong";LES.score={ok:0,n:0};lisRestart()};
  return;
 }
 var it=lisIt(),target=it.txt,res="";
 var nCh=(target.match(/[一-鿿]/g)||[]).length,pl=pyLib();
 var blank=!target;
 if(LES.res&&LES.res.free){
  res=`<div class="fb ok">Đã lưu bản bạn gõ<div class="hz" style="font-size:28px">${esc(it.mine||"")}</div><div class="mu">Bài chưa có lời thoại nên chưa chấm. Bấm «Lời thoại» bên dưới để dán lời thoại, sau đó làm lại để chấm đúng/sai. Nhấn <kbd>Enter</kbd> hoặc <kbd>→</kbd> sang câu tiếp.</div></div>`;
 }else if(LES.res){
  var pyTxt="";if(pl){try{pyTxt=pl.pinyin(target,{toneType:"symbol"})}catch(e){}}
  res=`<div class="fb ${LES.res.gave?"no":"ok"}">${LES.res.gave?"Đáp án":(LES.tries===0?"✓ Chính xác!":"✓ Đúng rồi sau "+(LES.tries+1)+" lần thử")}<div class="hz" style="font-size:28px">${esc(target)}</div>${pyTxt?`<div class="py" style="font-size:16px">${esc(pyTxt)}</div>`:""}<div class="mu">${LES.res.gave?"Nhấn <kbd>→</kbd>":"Nhấn <kbd>Enter</kbd> hoặc <kbd>→</kbd>"} để sang câu tiếp theo</div></div>`;
 }else if(LES.mask){
  res=`<div class="fb no">${LES.st==="wrong"?"Chưa đúng. Nhấn Enter để xoá rồi gõ lại.":"Gợi ý từ lần gõ trước"}<div class="hz" style="font-size:30px">${LES.mask}</div></div>`;
 }
 var cls=LES.res?(LES.res.gave?"bad":"good"):(LES.st==="wrong"?"bad":"");
 var ytLink=l.src.type==="yt"?`<p class="mu" style="margin:8px 0 0"><a href="https://www.youtube.com/watch?v=${l.src.id}&t=${Math.floor(it.t)}s" target="_blank" rel="noopener" style="color:var(--ac)">↗ Mở câu này trên YouTube</a></p><p class="mu" id="lmsg" style="text-align:left;color:var(--no);display:${LES.ytWarn?"block":"none"}">Không điều khiển được trình phát YouTube (video có thể chặn nhúng hoặc môi trường không cho nhúng). Hãy dùng liên kết trên để nghe từng câu.</p>`:"";
 el.innerHTML=`<div class="card">
 <div class="seq"><b style="font-size:22px">Câu ${LES.pos+1} / ${n}</b><span class="mu">Vòng ${LES.round} · câu gốc #${LES.deck[LES.pos]+1} · ${fmtT(it.t)} → ${fmtT(segEndOf(it))}</span></div>
 <div class="bar"><i style="width:${Math.round((LES.pos+(LES.res?1:0))/n*100)}%"></i></div>
 <div class="row" style="margin-top:0"><select id="lord"><option value="seq">Theo thứ tự</option><option value="rand">Ngẫu nhiên</option><option value="wrong">Chỉ câu hay sai</option></select><span class="mu" style="white-space:nowrap">${blank?"chưa có lời thoại":nCh+" chữ Hán"}</span></div>
 <div class="row"><button class="pri" id="lplay" style="white-space:nowrap">▶ Phát câu này</button><span class="mu" style="white-space:nowrap">Tốc độ</span><select id="lrate">${[0.5,0.75,1,1.25].map(function(r){return `<option value="${r}"${r===LES.rate?" selected":""}>${r}x</option>`}).join("")}</select></div>
 <div class="row"><input id="lans" class="${cls}" placeholder="Nghe và gõ chữ Hán hoặc pinyin của câu" autocomplete="off" value="${esc(LES.typed||"")}"${LES.res?" disabled":""}></div>
 ${res}
 <table class="keys"><tr><td><kbd>Tab</kbd></td><td>Nghe lại câu và gõ lại</td></tr><tr><td><kbd>Enter</kbd></td><td>Chấm bài. Sai: Enter lần nữa để xoá phần đã gõ. Đúng: Enter để sang câu mới</td></tr><tr><td><kbd>→</kbd> <kbd>←</kbd></td><td>Câu tiếp theo / câu trước</td></tr><tr><td><kbd>↓</kbd></td><td>Xem đáp án</td></tr></table>
 ${ytLink}<p class="mu">Điểm: ${LES.score.ok}/${LES.score.n} · <a href="#" id="lscr" style="color:var(--ac)">✎ Lời thoại (dán / sửa)</a></p>
 ${LES.edit?`<div class="card" style="margin:8px 0 0"><b>Lời thoại theo từng đoạn nghe</b><p class="mu" style="text-align:left;margin:6px 0">Mỗi dòng ứng với một đoạn nghe, theo thứ tự (bài có ${n} đoạn). Có thể dán cả dòng có mốc giờ, mốc sẽ bị bỏ qua.</p><textarea id="lscript" rows="8" style="width:100%">${esc(l.items.map(function(i){return i.txt}).join("\n"))}</textarea><div class="row"><button class="pri" id="lscs">Lưu và làm lại</button><button id="lscc">Đóng</button></div></div>`:""}
 </div>`;
 $("lscr").onclick=function(e){e.preventDefault();LES.edit=!LES.edit;renderLBody()};
 if(LES.edit){$("lscs").onclick=lisSaveScript;$("lscc").onclick=function(){LES.edit=false;renderLBody()}}
 $("lrate").onchange=function(){setRate(+this.value);this.blur();var i=$("lans");if(i&&!LES.res)i.focus()};
 $("lplay").onclick=function(){lisPlay();var i=$("lans");if(i&&!LES.res)i.focus()};
 $("lord").value=LES.order;
 $("lord").onchange=function(){LES.order=this.value;LES.pos=0;LES.round=1;LES.score={ok:0,n:0};lisDeck();lisReset();renderLBody();setTimeout(lisPlay,150)};
 var inp=$("lans");if(inp&&!LES.res){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}
}
function lisKey(e){
 var v=LES.view,t=e.target,tag=t&&t.tagName;
 if(v==="practice"){
  var l=curLesson();if(!l||LES.pos>=LES.deck.length)return;
  if(tag==="TEXTAREA")return;
  if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();lisRetry();return}
  if(e.repeat)return;
  if(e.key==="Enter"){if(tag==="SELECT"||tag==="BUTTON"||tag==="A")return;e.preventDefault();lisEnter();return}
  if(e.key==="ArrowDown"&&tag!=="SELECT"&&tag!=="AUDIO"&&t.type!=="range"){e.preventDefault();lisReveal();return}
  if(tag==="SELECT"||tag==="AUDIO"||t.type==="range")return;
  var isTxt=tag==="INPUT"&&t.type==="text";
  if(e.key==="ArrowRight"&&!e.shiftKey&&!e.altKey){
   if(e.ctrlKey||e.metaKey||!isTxt||(t.selectionStart===t.value.length&&t.selectionEnd===t.value.length)){e.preventDefault();lisNext()}
   return;
  }
  if(e.key==="ArrowLeft"&&!e.shiftKey&&!e.altKey){
   if(e.ctrlKey||e.metaKey||!isTxt||(t.selectionStart===0&&t.selectionEnd===0)){e.preventDefault();lisPrev()}
  }
 }else if(v==="sync"){
  if(tag==="SELECT"||tag==="INPUT"||tag==="TEXTAREA")return;
  if(e.repeat)return;
  if(e.key==="Enter"&&tag!=="BUTTON"){e.preventDefault();syncMark()}
  else if(e.key==="Backspace"){e.preventDefault();syncUndo()}
  else if(e.key===" "&&tag!=="BUTTON"&&tag!=="AUDIO"){e.preventDefault();pToggle()}
 }
}
function render(){({rev:renderRev,dic:renderDic,lis:renderLis,voc:renderVoc,rad:renderRad,sta:renderSta})[S.tab]()}
load();render();
</script>
</body>
</html>
